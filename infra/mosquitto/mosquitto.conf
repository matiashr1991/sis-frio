# Local development only: anonymous access on the LAN. Add auth + TLS before going to a VPS.
# per_listener_settings makes allow_anonymous / password_file apply to the listener declared above them.
per_listener_settings true

# :1883 anonymous (dev clients and the sensor node)
listener 1883 0.0.0.0
allow_anonymous true

# :1884 requires a user (optional: lets the config wizard test broker credentials).
# The password file must exist before `docker compose up`, or mosquitto will not start. From infra/:
#   docker run --rm -v ${PWD}/mosquitto:/work eclipse-mosquitto:2 mosquitto_passwd -c -b /work/passwd frio-test <password>
# To drop this listener: remove this block, the 1884 port and the passwd mount in docker-compose.yml.
listener 1884 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
